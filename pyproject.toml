[project]
name = "fastapi-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Victor Aparicio", email = "victoraparicio2066@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.2",
    "pytailwindcss>=0.4.2",
    "supabase>=2.33.0",
]

[project.scripts]
fastapi-2026 = "fastapi_2026:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.setuptools.packages.find]
where = ["src"] # <-- Le dice a Python que busque paquetes dentro de 'src'
